name: Update profile

# Redraws the panel every day. The daily commit also keeps GitHub from pausing this schedule.
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
  push:
    paths:
      - "me.sql"
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw the panel images
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_profile.py

      - name: Save it if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROFILE_README.md assets
          git diff --cached --quiet || { git commit -m "chore(profile): update stats" && git push; }
